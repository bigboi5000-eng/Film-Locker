          type: string
          enum: [recommendation, message]
        id:
          type: integer
        fromUserId:
          type: string
        toUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        tmdbId:
          type: integer
          nullable: true
        filmTitle:
          type: string
          nullable: true
        posterUrl:
          type: string
          nullable: true
        isRead:
          type: boolean
          nullable: true
        content:
          type: string
          nullable: true
          description: Present when type is "message" — the canned phrase/emoji sent
        replyToNotificationId:
          type: integer
          nullable: true
        replyToFilmTitle:
          type: string
          nullable: true
          description: Denormalized title of the film this message replies to, if any
      required:
        - type
        - id
        - fromUserId
        - toUserId
        - createdAt

