openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: movies
    description: Film Locker movie operations
  - name: notifications
    description: Film recommendation notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /movies/recommendations:
    get:
      operationId: getRecommendations
      tags: [movies]
      summary: >
        Personalised recommendations based on the user's watchlist.
        Calls TMDB recommendations for each saved film, deduplicates,
        and filters out already-saved films. Returns an empty list when
        the watchlist is empty.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"

  /movies/trending:
    get:
      operationId: getTrending
      tags: [movies]
      summary: Fetch trending movies this week from TMDB
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"

  /movies/new-releases:
    get:
      operationId: getNewReleases
      tags: [movies]
      summary: Fetch movies currently in theatres from TMDB
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewReleasesResponse"

  /movies/search:
    get:
      operationId: searchMovies
      tags: [movies]
      summary: Search TMDB for movies by title
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results from TMDB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMoviesResponse"

  /movies/parse-caption:
    post:
      operationId: parseCaption
      tags: [movies]
      summary: Parse a social media caption and find matching movies via TMDB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseCaptionBody"
      responses:
        "200":
          description: Candidate movies found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseCaptionResponse"

  /movies/ai-extract:
    post:
      operationId: aiExtract
      tags: [movies]
      summary: >
        Use Gemini AI to extract movie references from text, enrich each with
        TMDB data, and automatically save them to the locker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiExtractBody"
      responses:
        "200":
          description: Extraction complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiExtractResponse"

  /movies/process-social-link:
    post:
      operationId: processSocialLink
      tags: [movies]
      summary: >
        Extract movies from a social media URL. Fetches the post caption via
        RapidAPI (source="caption"); falls back to yt-dlp audio download
        processed natively by Gemini 2.5 Flash via the Files API
        (source="audio") when no caption is present. Matched movies are saved
        to the locker. Only GEMINI_API_KEY and RAPIDAPI_KEY are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessSocialLinkBody"
      responses:
        "200":
          description: Processing complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessSocialLinkResponse"

  /movies/recommend:
    post:
      operationId: recommendMovies
      tags: [movies]
      summary: >
        Ask Gemini for film/TV recommendations from a natural-language query
        (e.g. "recommend a 90 minute horror film similar to Texas Chainsaw
        Massacre"), enrich each with TMDB data, and optionally save to the
        locker. Strictly scoped to film/TV requests — Gemini is instructed to
        refuse anything else, surfaced as offTopic=true with no matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendBody"
      responses:
        "200":
          description: Recommendation complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendResponse"

  /movies/tmdb/{tmdbId}:
    get:
      operationId: getMovieDetails
      tags: [movies]
      summary: >
        Fetch full TMDB details (director, cast, genres, watch providers) for
        any movie by TMDB ID without saving it to the locker.
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movie details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbMovieDetailsResponse"
        "404":
          description: Movie not found on TMDB

  /movies:
    get:
      operationId: listMovies
      tags: [movies]
      summary: List all movies in the locker
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMoviesResponse"
    post:
      operationId: addMovie
      tags: [movies]
      summary: Add a movie to the locker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMovieBody"
      responses:
        "201":
          description: Movie added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /movies/{id}/watched:
    patch:
      operationId: patchWatched
      tags: [movies]
      summary: Mark a movie as watched or unwatched
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWatchedBody"
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /movies/{id}/rating:
    patch:
      operationId: patchRating
      tags: [movies]
      summary: Set or clear the star rating (1–5) for a movie
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRatingBody"
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /movies/{id}:
    delete:
      operationId: deleteMovie
      tags: [movies]
      summary: Remove a movie from the locker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Movie removed

  /films/{tmdbId}/community-score:
    get:
      operationId: getFilmCommunityScore
      tags: [movies]
      summary: Get the average community rating and count for a film
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Community score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmCommunityScore"

  /films/{tmdbId}/community-rating:
    post:
      operationId: setFilmCommunityRating
      tags: [movies]
      summary: Set or update the authenticated user's community rating for a film
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCommunityRatingBody"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmCommunityScore"

  /films/{tmdbId}/comments:
    get:
      operationId: getFilmComments
      tags: [movies]
      summary: Get paginated public comments for a film
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmCommentsResponse"
    post:
      operationId: postFilmComment
      tags: [movies]
      summary: Post a new comment on a film (auth required)
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCommentBody"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmComment"

  /films/{tmdbId}/comments/{id}:
    delete:
      operationId: deleteFilmComment
      tags: [movies]
      summary: Delete own comment (auth required)
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted

  /users/push-token:
    put:
      operationId: updatePushToken
      tags: [notifications]
      summary: Store or update the authenticated user's Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePushTokenBody"
      responses:
        "204":
          description: Token saved
        "400":
          description: Invalid token
        "401":
          description: Unauthorized

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Fetch the authenticated user's notification inbox, newest first
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
        "401":
          description: Unauthorized
    post:
      operationId: sendNotification
      tags: [notifications]
      summary: Send a film recommendation to another user (auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationBody"
      responses:
        "201":
          description: Notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmNotification"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Cannot send to this user
        "404":
          description: Recipient not found

  /notifications/users:
    get:
      operationId: getNotificationUsers
      tags: [notifications]
      summary: List other registered users to recommend films to
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationUsersResponse"
        "401":
          description: Unauthorized

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmNotification"
        "401":
          description: Unauthorized
        "404":
          description: Notification not found

  /notifications/{id}/react:
    patch:
      operationId: reactToNotification
      tags: [notifications]
      summary: Set an emoji or text reaction on a received notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactNotificationBody"
      responses:
        "200":
          description: Reaction saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactNotificationResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Notification not found

  /notifications/thread/{userId}:
    get:
      operationId: getNotificationThread
      tags: [notifications]
      summary: All recommendations from a specific user to the authenticated user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thread of notifications from this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationThreadResponse"
        "401":
          description: Unauthorized

  /users/sync:
    post:
      operationId: syncUser
      tags: [users]
      summary: JIT-provision the authenticated user's row in the users table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUserBody"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the authenticated user's own profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
        "404":
          description: Profile not found (not synced yet)
    put:
      operationId: updateMe
      tags: [users]
      summary: Update the authenticated user's profile (e.g. username)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search users by username or email
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUsersResponse"
        "400":
          description: Query too short
        "401":
          description: Unauthorized

  /follows:
    get:
      operationId: getFollows
      tags: [users]
      summary: Get the authenticated user's following and follower lists
      responses:
        "200":
          description: Follow lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowsResponse"
        "401":
          description: Unauthorized
    post:
      operationId: followUser
      tags: [users]
      summary: Follow another user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowBody"
      responses:
        "201":
          description: Followed
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /follows/{userId}:
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unfollowed
        "401":
          description: Unauthorized

  /playlists:
    get:
      operationId: getMyPlaylists
      tags: [playlists]
      summary: Get the authenticated user's playlists
      responses:
        "200":
          description: User's playlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistsResponse"
        "401":
          description: Unauthorized
    post:
      operationId: createPlaylist
      tags: [playlists]
      summary: Create a new playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylistBody"
      responses:
        "201":
          description: Created playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /playlists/public:
    get:
      operationId: searchPublicPlaylists
      tags: [playlists]
      summary: Search public playlists
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Public playlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistsResponse"

  /playlists/{id}:
    get:
      operationId: getPlaylist
      tags: [playlists]
      summary: Get a playlist with its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playlist with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistWithItems"
        "403":
          description: Private playlist
        "404":
          description: Not found
    put:
      operationId: updatePlaylist
      tags: [playlists]
      summary: Update playlist name, description, or privacy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaylistBody"
      responses:
        "200":
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Delete a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  /playlists/{id}/items:
    post:
      operationId: addPlaylistItem
      tags: [playlists]
      summary: Add a film to a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlaylistItemBody"
      responses:
        "201":
          description: Item added
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Not your playlist
        "404":
          description: Playlist not found

  /playlists/{id}/items/{tmdbId}:
    delete:
      operationId: removePlaylistItem
      tags: [playlists]
      summary: Remove a film from a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized
        "403":
          description: Not your playlist

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    WatchProvider:
      type: object
      properties:
        provider_id:
          type: integer
        provider_name:
          type: string
        logo_url:
          type: string
        type:
          type: string
          enum: [flatrate, rent, buy]
          description: >
            Whether the title is included in a subscription (flatrate),
            or available to rent or buy individually.
        link:
          type: string
          description: JustWatch deep-link for this film (opens the film's page on JustWatch)
      required:
        - provider_id
        - provider_name
        - logo_url

    Movie:
      type: object
      properties:
        id:
          type: integer
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
        director:
          type: string
        cast:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        language:
          type: string
        watchProviders:
          type: array
          items:
            $ref: "#/components/schemas/WatchProvider"
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        isWatched:
          type: boolean
        watchedAt:
          type: string
          format: date-time
          nullable: true
        addedAt:
          type: string
          format: date-time
      required:
        - id
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview
        - director
        - cast
        - genres
        - language
        - watchProviders
        - isWatched
        - addedAt

    TmdbMovieCard:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
        genres:
          type: array
          items:
            type: string
          description: Genre names mapped from TMDB genre_ids
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview
        - genres

    TmdbMovieDetailsResponse:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
        director:
          type: string
        cast:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        language:
          type: string
        watchProviders:
          type: array
          items:
            $ref: "#/components/schemas/WatchProvider"
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview
        - director
        - cast
        - genres
        - language
        - watchProviders

    MovieCandidate:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview

    GeminiMovieMatch:
      type: object
      description: Single movie reference extracted by Gemini, with confidence score
      properties:
        movie_title:
          type: string
        release_year:
          type: string
        confidence_score:
          type: number
          format: float
        tmdb_id:
          type: integer
          nullable: true
        # TMDB card fields — populated in dry-run mode so the UI can show a
        # film card without a separate API call.
        poster_url:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        overview:
          type: string
          nullable: true
        synopsis:
          type: string
          nullable: true
          description: >
            Very short (one-sentence) hook written by Gemini specifically for
            recommend results — only populated by POST /movies/recommend,
            null everywhere else.
      required:
        - movie_title
        - release_year
        - confidence_score

    SearchMoviesResponse:
      type: object
      required: [movies]
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/TmdbMovieCard"

    RecommendationsResponse:
      type: object
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/TmdbMovieCard"
      required:
        - movies

    TrendingResponse:
      type: object
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/TmdbMovieCard"
      required:
        - movies

    NewReleasesResponse:
      type: object
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/TmdbMovieCard"
      required:
        - movies

    ListMoviesResponse:
      type: object
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
      required:
        - movies

    AddMovieBody:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview

    ParseCaptionBody:
      type: object
      properties:
        caption:
          type: string
      required:
        - caption

    ParseCaptionResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MovieCandidate"
      required:
        - candidates

    AiExtractBody:
      type: object
      properties:
        text:
          type: string
      required:
        - text

    AiExtractResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMovieMatch"
        saved:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
      required:
        - matches
        - saved

    ProcessSocialLinkBody:
      type: object
      properties:
        url:
          type: string
          format: uri
        dryRun:
          type: boolean
          description: >
            When true, identify films from the URL but do NOT save them to the
            locker. The response `matches` will include TMDB card data
            (poster_url, title, overview) so the UI can show a confirmation
            card before the user explicitly adds the film.
      required:
        - url

    ProcessSocialLinkResponse:
      type: object
      properties:
        source:
          type: string
          enum: [caption, audio, video, none]
        text:
          type: string
          nullable: true
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMovieMatch"
        saved:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
        listTitle:
          type: string
          nullable: true
          description: >
            Suggested playlist name when the source was a curated/ranked list
            of films (e.g. "Top 10 Horror Films of All Time"), null otherwise.
      required:
        - source
        - matches
        - saved
        - listTitle

    RecommendBody:
      type: object
      properties:
        query:
          type: string
          description: >
            Natural-language film/TV request, e.g. "recommend a 90 minute
            horror film similar to Texas Chainsaw Massacre".
        dryRun:
          type: boolean
          description: >
            When true, identify recommended films but do NOT save them to the
            locker. The response `matches` will include TMDB card data
            (poster_url, title, overview) so the UI can show a confirmation
            card before the user explicitly adds the film.
      required:
        - query

    RecommendResponse:
      type: object
      properties:
        offTopic:
          type: boolean
          description: >
            True when the query wasn't a film/TV request and Gemini refused
            to answer it — matches will be empty in this case.
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMovieMatch"
        saved:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
        listTitle:
          type: string
          nullable: true
          description: >
            Suggested playlist name when the recommendation is a themed set of
            multiple films (e.g. "90s Feel-Good Comedies"), null for a single
            recommendation.
      required:
        - offTopic
        - matches
        - saved
        - listTitle

    PatchWatchedBody:
      type: object
      properties:
        isWatched:
          type: boolean
      required:
        - isWatched

    PatchRatingBody:
      type: object
      properties:
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
      required:
        - rating

    FilmCommunityScore:
      type: object
      properties:
        tmdbId:
          type: integer
        average:
          type: number
          format: float
          nullable: true
          description: Average star rating across all community ratings, null when no ratings exist
        count:
          type: integer
          description: Total number of community ratings
        userRating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: The authenticated user's own community rating (null if not rated or not logged in)
      required:
        - tmdbId
        - average
        - count

    SetCommunityRatingBody:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
      required:
        - rating

    FilmComment:
      type: object
      properties:
        id:
          type: integer
        tmdbId:
          type: integer
        userId:
          type: string
          description: Clerk user ID of the author
        username:
          type: string
          nullable: true
          description: Display username of the author
        avatarUrl:
          type: string
          nullable: true
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isOwn:
          type: boolean
          description: True when the authenticated user authored this comment
      required:
        - id
        - tmdbId
        - userId
        - body
        - createdAt
        - updatedAt
        - isOwn

    FilmCommentsResponse:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/FilmComment"
        page:
          type: integer
        hasMore:
          type: boolean
      required:
        - comments
        - page
        - hasMore

    PostCommentBody:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 280
      required:
        - body

    FilmNotification:
      type: object
      properties:
        id:
          type: integer
        fromUserId:
          type: string
          description: Clerk user ID of the sender
        fromUsername:
          type: string
          nullable: true
          description: Display username of the sender
        fromAvatarUrl:
          type: string
          nullable: true
        toUserId:
          type: string
          description: Clerk user ID of the recipient
        tmdbId:
          type: integer
        filmTitle:
          type: string
        posterUrl:
          type: string
        isRead:
          type: boolean
        reaction:
          type: string
          nullable: true
          description: Emoji or "Watched it!" set by the recipient
        reactedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fromUserId
        - toUserId
        - tmdbId
        - filmTitle
        - posterUrl
        - isRead
        - createdAt

    NotificationsResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/FilmNotification"
        unreadCount:
          type: integer
      required:
        - notifications
        - unreadCount

    SendNotificationBody:
      type: object
      properties:
        toUserId:
          type: string
          description: Clerk user ID of the recipient
        tmdbId:
          type: integer
        filmTitle:
          type: string
        posterUrl:
          type: string
      required:
        - toUserId
        - tmdbId
        - filmTitle
        - posterUrl

    NotificationUser:
      type: object
      properties:
        clerkId:
          type: string
        username:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - clerkId

    NotificationUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/NotificationUser"
      required:
        - users

    ReactNotificationBody:
      type: object
      properties:
        reaction:
          type: string
          enum:
            - "👍"
            - "❤️"
            - "😂"
            - "🎬"
            - "🤩"
            - "Watched it!"
            - "This was great!"
            - "Thank you!"
            - "Not for me this one"
          description: >
            A fixed set of emoji/canned-phrase reactions — deliberately not a
            freeform string. There is no messaging feature in this app and
            this is the only user-to-user "expression" endpoint, so the enum
            is enforced here (not just left to the client UI) to guarantee
            free text can never reach another user through it.
      required:
        - reaction

    ReactNotificationResponse:
      type: object
      properties:
        id:
          type: integer
        reaction:
          type: string
          nullable: true
        reactedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id

    NotificationThreadResponse:
      type: object
      properties:
