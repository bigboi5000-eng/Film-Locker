openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: movies
    description: Film Locker movie operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /movies/trending:
    get:
      operationId: getTrending
      tags: [movies]
      summary: Fetch trending movies this week from TMDB
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"

  /movies/new-releases:
    get:
      operationId: getNewReleases
      tags: [movies]
      summary: Fetch movies currently in theatres from TMDB
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewReleasesResponse"

  /movies/search:
    get:
      operationId: searchMovies
      tags: [movies]
      summary: Search TMDB for movies by title
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results from TMDB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMoviesResponse"

  /movies/parse-caption:
    post:
      operationId: parseCaption
      tags: [movies]
      summary: Parse a social media caption and find matching movies via TMDB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseCaptionBody"
      responses:
        "200":
          description: Candidate movies found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseCaptionResponse"

  /movies/ai-extract:
    post:
      operationId: aiExtract
      tags: [movies]
      summary: >
        Use Gemini AI to extract movie references from text, enrich each with
        TMDB data, and automatically save them to the locker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiExtractBody"
      responses:
        "200":
          description: Extraction complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiExtractResponse"

  /movies/process-social-link:
    post:
      operationId: processSocialLink
      tags: [movies]
      summary: >
        Extract movies from a social media URL. Fetches the post caption via
        RapidAPI (source="caption"); falls back to yt-dlp audio download
        processed natively by Gemini 2.5 Flash via the Files API
        (source="audio") when no caption is present. Matched movies are saved
        to the locker. Only GEMINI_API_KEY and RAPIDAPI_KEY are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessSocialLinkBody"
      responses:
        "200":
          description: Processing complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessSocialLinkResponse"

  /movies/tmdb/{tmdbId}:
    get:
      operationId: getMovieDetails
      tags: [movies]
      summary: >
        Fetch full TMDB details (director, cast, genres, watch providers) for
        any movie by TMDB ID without saving it to the locker.
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movie details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbMovieDetailsResponse"
        "404":
          description: Movie not found on TMDB

  /movies:
    get:
      operationId: listMovies
      tags: [movies]
      summary: List all movies in the locker
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMoviesResponse"
    post:
      operationId: addMovie
      tags: [movies]
      summary: Add a movie to the locker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMovieBody"
      responses:
        "201":
          description: Movie added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /movies/{id}/watched:
    patch:
      operationId: patchWatched
      tags: [movies]
      summary: Mark a movie as watched or unwatched
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWatchedBody"
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /movies/{id}/rating:
    patch:
      operationId: patchRating
      tags: [movies]
      summary: Set or clear the star rating (1–5) for a movie
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRatingBody"
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /movies/{id}:
    delete:
      operationId: deleteMovie
      tags: [movies]
      summary: Remove a movie from the locker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Movie removed

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    WatchProvider:
      type: object
      properties:
        provider_id:
          type: integer
        provider_name:
          type: string
        logo_url:
          type: string
        type:
          type: string
          enum: [flatrate, rent, buy]
          description: >
            Whether the title is included in a subscription (flatrate),
            or available to rent or buy individually.
        link:
          type: string
          description: JustWatch deep-link for this film (opens the film's page on JustWatch)
      required:
        - provider_id
        - provider_name
        - logo_url

    Movie:
      type: object
      properties:
        id:
          type: integer
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
        director:
          type: string
        cast:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        language:
          type: string
        watchProviders:
          type: array
          items:
            $ref: "#/components/schemas/WatchProvider"
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        isWatched:
          type: boolean
        watchedAt:
          type: string
          format: date-time
          nullable: true
        addedAt:
          type: string
          format: date-time
      required:
        - id
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview
        - director
        - cast
        - genres
        - language
        - watchProviders
        - isWatched
        - addedAt

    TmdbMovieCard:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview

    TmdbMovieDetailsResponse:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
        director:
          type: string
        cast:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        language:
          type: string
        watchProviders:
          type: array
          items:
            $ref: "#/components/schemas/WatchProvider"
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview
        - director
        - cast
        - genres
        - language
        - watchProviders

    MovieCandidate:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview

    GeminiMovieMatch:
      type: object
      description: Single movie reference extracted by Gemini, with confidence score
      properties:
        movie_title:
          type: string
        release_year:
          type: string
        confidence_score:
          type: number
          format: float
        tmdb_id:
          type: integer
          nullable: true
        # TMDB card fields — populated in dry-run mode so the UI can show a
        # film card without a separate API call.
        poster_url:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        overview:
          type: string
          nullable: true
      required:
        - movie_title
        - release_year
        - confidence_score

    SearchMoviesResponse:
      type: object
      required: [movies]
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/TmdbMovieCard"

    TrendingResponse:
      type: object
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/TmdbMovieCard"
      required:
        - movies

    NewReleasesResponse:
      type: object
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/TmdbMovieCard"
      required:
        - movies

    ListMoviesResponse:
      type: object
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
      required:
        - movies

    AddMovieBody:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview

    ParseCaptionBody:
      type: object
      properties:
        caption:
          type: string
      required:
        - caption

    ParseCaptionResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MovieCandidate"
      required:
        - candidates

    AiExtractBody:
      type: object
      properties:
        text:
          type: string
      required:
        - text

    AiExtractResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMovieMatch"
        saved:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
      required:
        - matches
        - saved

    ProcessSocialLinkBody:
      type: object
      properties:
        url:
          type: string
          format: uri
        dryRun:
          type: boolean
          description: >
            When true, identify films from the URL but do NOT save them to the
            locker. The response `matches` will include TMDB card data
            (poster_url, title, overview) so the UI can show a confirmation
            card before the user explicitly adds the film.
      required:
        - url

    ProcessSocialLinkResponse:
      type: object
      properties:
        source:
          type: string
          enum: [caption, audio, none]
        text:
          type: string
          nullable: true
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMovieMatch"
        saved:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
      required:
        - source
        - matches
        - saved

    PatchWatchedBody:
      type: object
      properties:
        isWatched:
          type: boolean
      required:
        - isWatched

    PatchRatingBody:
      type: object
      properties:
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
      required:
        - rating

