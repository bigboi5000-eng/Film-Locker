openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: movies
    description: Film Locker movie operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /movies:
    get:
      operationId: listMovies
      tags: [movies]
      summary: List all movies in the locker
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMoviesResponse"
    post:
      operationId: addMovie
      tags: [movies]
      summary: Add a movie to the locker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMovieBody"
      responses:
        "201":
          description: Movie added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
  /movies/parse-caption:
    post:
      operationId: parseCaption
      tags: [movies]
      summary: Parse a social media caption and find matching movies via TMDB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseCaptionBody"
      responses:
        "200":
          description: Candidate movies found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseCaptionResponse"
  /movies/ai-extract:
    post:
      operationId: aiExtract
      tags: [movies]
      summary: >
        Use Gemini AI to extract movie references from text, enrich each with
        TMDB poster data, and automatically save them to the locker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiExtractBody"
      responses:
        "200":
          description: Extraction complete — returns Gemini matches and saved Movie records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiExtractResponse"
  /movies/{id}:
    delete:
      operationId: deleteMovie
      tags: [movies]
      summary: Remove a movie from the locker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Movie removed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Movie:
      type: object
      properties:
        id:
          type: integer
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
        addedAt:
          type: string
          format: date-time
      required:
        - id
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview
        - addedAt
    MovieCandidate:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview
    GeminiMovieMatch:
      type: object
      description: Single movie reference extracted by Gemini, with confidence score
      properties:
        movie_title:
          type: string
          description: Canonical movie title as returned by Gemini
        release_year:
          type: string
          description: Four-digit release year, or empty string if unknown
        confidence_score:
          type: number
          format: float
          description: Gemini confidence 0.0–1.0 that this is a genuine movie reference
        tmdb_id:
          type: integer
          nullable: true
          description: >
            TMDB movie ID resolved after lookup. Null when TMDB returned no
            match or confidence was below threshold.
      required:
        - movie_title
        - release_year
        - confidence_score
    ListMoviesResponse:
      type: object
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
      required:
        - movies
    AddMovieBody:
      type: object
      properties:
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
          type: string
        overview:
          type: string
      required:
        - tmdbId
        - title
        - releaseYear
        - posterUrl
        - overview
    ParseCaptionBody:
      type: object
      properties:
        caption:
          type: string
      required:
        - caption
    ParseCaptionResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MovieCandidate"
      required:
        - candidates
    AiExtractBody:
      type: object
      properties:
        text:
          type: string
          description: Raw text to analyse — caption, freeform description, list, etc.
      required:
        - text
    AiExtractResponse:
      type: object
      properties:
        matches:
          type: array
          description: Every movie Gemini identified, ordered by confidence_score descending
          items:
            $ref: "#/components/schemas/GeminiMovieMatch"
        saved:
          type: array
          description: Movie records that were successfully found on TMDB and saved to the locker
          items:
            $ref: "#/components/schemas/Movie"
      required:
        - matches
        - saved
