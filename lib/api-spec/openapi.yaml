openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: movies
    description: Film Locker movie operations
  - name: notifications
    description: Film recommendation notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /movies/recommendations:
    get:
      operationId: getRecommendations
      tags: [movies]
      summary: >
        Personalised recommendations based on the user's watchlist.
        Calls TMDB recommendations for each saved film, deduplicates,
        and filters out already-saved films. Returns an empty list when
        the watchlist is empty.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"

  /movies/trending:
    get:
      operationId: getTrending
      tags: [movies]
      summary: Fetch trending movies this week from TMDB
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"

  /movies/new-releases:
    get:
      operationId: getNewReleases
      tags: [movies]
      summary: Fetch movies currently in theatres from TMDB
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewReleasesResponse"

  /movies/search:
    get:
      operationId: searchMovies
      tags: [movies]
      summary: Search TMDB for movies by title
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results from TMDB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMoviesResponse"

  /movies/parse-caption:
    post:
      operationId: parseCaption
      tags: [movies]
      summary: Parse a social media caption and find matching movies via TMDB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseCaptionBody"
      responses:
        "200":
          description: Candidate movies found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseCaptionResponse"

  /movies/ai-extract:
    post:
      operationId: aiExtract
      tags: [movies]
      summary: >
        Use Gemini AI to extract movie references from text, enrich each with
        TMDB data, and automatically save them to the locker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiExtractBody"
      responses:
        "200":
          description: Extraction complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiExtractResponse"

  /movies/process-social-link:
    post:
      operationId: processSocialLink
      tags: [movies]
      summary: >
        Extract movies from a social media URL. Fetches the post caption via
        RapidAPI (source="caption"); falls back to yt-dlp audio download
        processed natively by Gemini 2.5 Flash via the Files API
        (source="audio") when no caption is present. Matched movies are saved
        to the locker. Only GEMINI_API_KEY and RAPIDAPI_KEY are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessSocialLinkBody"
      responses:
        "200":
          description: Processing complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessSocialLinkResponse"

  /movies/recommend:
    post:
      operationId: recommendMovies
      tags: [movies]
      summary: >
        Ask Gemini for film/TV recommendations from a natural-language query
        (e.g. "recommend a 90 minute horror film similar to Texas Chainsaw
        Massacre"), enrich each with TMDB data, and optionally save to the
        locker. Strictly scoped to film/TV requests — Gemini is instructed to
        refuse anything else, surfaced as offTopic=true with no matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendBody"
      responses:
        "200":
          description: Recommendation complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendResponse"

  /movies/tmdb/{tmdbId}:
    get:
      operationId: getMovieDetails
      tags: [movies]
      summary: >
        Fetch full TMDB details (director, cast, genres, watch providers) for
        any movie by TMDB ID without saving it to the locker.
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movie details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbMovieDetailsResponse"
        "404":
          description: Movie not found on TMDB

  /movies:
    get:
      operationId: listMovies
      tags: [movies]
      summary: List all movies in the locker
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMoviesResponse"
    post:
      operationId: addMovie
      tags: [movies]
      summary: Add a movie to the locker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMovieBody"
      responses:
        "201":
          description: Movie added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /movies/{id}/watched:
    patch:
      operationId: patchWatched
      tags: [movies]
      summary: Mark a movie as watched or unwatched
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWatchedBody"
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /movies/{id}/rating:
    patch:
      operationId: patchRating
      tags: [movies]
      summary: Set or clear the star rating (1–5) for a movie
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRatingBody"
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"

  /movies/{id}:
    delete:
      operationId: deleteMovie
      tags: [movies]
      summary: Remove a movie from the locker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Movie removed

  /films/{tmdbId}/community-score:
    get:
      operationId: getFilmCommunityScore
      tags: [movies]
      summary: Get the average community rating and count for a film
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Community score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmCommunityScore"

  /films/{tmdbId}/community-rating:
    post:
      operationId: setFilmCommunityRating
      tags: [movies]
      summary: Set or update the authenticated user's community rating for a film
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCommunityRatingBody"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmCommunityScore"

  /films/{tmdbId}/comments:
    get:
      operationId: getFilmComments
      tags: [movies]
      summary: Get paginated public comments for a film
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmCommentsResponse"
    post:
      operationId: postFilmComment
      tags: [movies]
      summary: Post a new comment on a film (auth required)
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCommentBody"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmComment"

  /films/{tmdbId}/comments/{id}:
    delete:
      operationId: deleteFilmComment
      tags: [movies]
      summary: Delete own comment (auth required)
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted

  /users/push-token:
    put:
      operationId: updatePushToken
      tags: [notifications]
      summary: Store or update the authenticated user's Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePushTokenBody"
      responses:
        "204":
          description: Token saved
        "400":
          description: Invalid token
        "401":
          description: Unauthorized

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Fetch the authenticated user's notification inbox, newest first
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
        "401":
          description: Unauthorized
    post:
      operationId: sendNotification
      tags: [notifications]
      summary: Send a film recommendation to another user (auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationBody"
      responses:
        "201":
          description: Notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmNotification"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Cannot send to this user
        "404":
          description: Recipient not found

  /notifications/users:
    get:
      operationId: getNotificationUsers
      tags: [notifications]
      summary: List other registered users to recommend films to
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationUsersResponse"
        "401":
          description: Unauthorized

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmNotification"
        "401":
          description: Unauthorized
        "404":
          description: Notification not found

  /notifications/thread/{userId}:
    get:
      operationId: getNotificationThread
      tags: [notifications]
      summary: >
        Merged chronological chat feed with a specific user — recommendations
        sent either way plus reactions/messages, newest last
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feed of recommendations and messages with this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationThreadResponse"
        "401":
          description: Unauthorized

  /notifications/thread/{userId}/messages:
    post:
      operationId: sendConversationMessage
      tags: [notifications]
      summary: >
        Send a reaction/message to a user from the fixed vocabulary — either
        a reply to a specific film recommendation (replyToNotificationId) or
        a standalone message. Allowed regardless of whether a recommendation
        exists, as long as a follow relationship exists in either direction.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendConversationMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationFeedItem"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: No relationship with this user
        "404":
          description: User or replied-to notification not found

  /users/sync:
    post:
      operationId: syncUser
      tags: [users]
      summary: JIT-provision the authenticated user's row in the users table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUserBody"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the authenticated user's own profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
        "404":
          description: Profile not found (not synced yet)
    put:
      operationId: updateMe
      tags: [users]
      summary: Update the authenticated user's profile (e.g. username)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
    delete:
      operationId: deleteMe
      tags: [users]
      summary: >
        Permanently delete the authenticated user's Film Locker data — their
        locker, comments, ratings, notifications, messages, follows,
        playlists, and feedback. Call this before deleting the Clerk
        identity itself; it does not touch Clerk.
      responses:
        "204":
          description: Account data deleted
        "401":
          description: Unauthorized

  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search users by username or email
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUsersResponse"
        "400":
          description: Query too short
        "401":
          description: Unauthorized

  /follows:
    get:
      operationId: getFollows
      tags: [users]
      summary: Get the authenticated user's following and follower lists
      responses:
        "200":
          description: Follow lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowsResponse"
        "401":
          description: Unauthorized
    post:
      operationId: followUser
      tags: [users]
      summary: >
        Follow another user. Accepted immediately if they're public; creates
        a pending follow request if they're private.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowBody"
      responses:
        "201":
          description: Followed or requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /follows/{userId}:
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user, or cancel an outgoing follow request you sent them
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unfollowed / request cancelled
        "401":
          description: Unauthorized

  /follows/{userId}/accept:
    patch:
      operationId: acceptFollowRequest
      tags: [users]
      summary: Accept an incoming follow request from userId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResponse"
        "401":
          description: Unauthorized
        "404":
          description: No pending request from this user

  /follows/{userId}/request:
    delete:
      operationId: declineFollowRequest
      tags: [users]
      summary: Decline an incoming pending follow request from userId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request declined
        "401":
          description: Unauthorized

  /feedback:
    post:
      operationId: submitFeedback
      tags: [users]
      summary: >
        Send feedback from the account management page. Always saved to the
        database first; a notification email is best-effort on top of that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackBody"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitFeedbackResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /blocks:
    get:
      operationId: getBlocks
      tags: [users]
      summary: List users the authenticated user has blocked
      responses:
        "200":
          description: Blocked users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBlocksResponse"
        "401":
          description: Unauthorized
    post:
      operationId: blockUser
      tags: [users]
      summary: >
        Block a user. Also removes any existing follow relationship between
        the two people, in either direction (including a still-pending
        request).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserBody"
      responses:
        "201":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockUserResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /blocks/{userId}:
    delete:
      operationId: unblockUser
      tags: [users]
      summary: Unblock a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unblocked
        "401":
          description: Unauthorized

  /reports:
    post:
      operationId: submitReport
      tags: [users]
      summary: >
        Report a user, optionally about a specific comment. Always saved to
        the database first; a notification email is best-effort on top of
        that — there's no in-app moderation queue yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReportBody"
      responses:
        "201":
          description: Report recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitReportResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /playlists:
    get:
      operationId: getMyPlaylists
      tags: [playlists]
      summary: Get the authenticated user's playlists
      responses:
        "200":
          description: User's playlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistsResponse"
        "401":
          description: Unauthorized
    post:
      operationId: createPlaylist
      tags: [playlists]
      summary: Create a new playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylistBody"
      responses:
        "201":
          description: Created playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /playlists/public:
    get:
      operationId: searchPublicPlaylists
      tags: [playlists]
      summary: Search public playlists
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Public playlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistsResponse"

  /playlists/{id}:
    get:
      operationId: getPlaylist
      tags: [playlists]
      summary: Get a playlist with its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playlist with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistWithItems"
        "403":
          description: Private playlist
        "404":
          description: Not found
    put:
      operationId: updatePlaylist
      tags: [playlists]
      summary: Update playlist name, description, or privacy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaylistBody"
      responses:
        "200":
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Delete a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  /playlists/{id}/items:
    post:
      operationId: addPlaylistItem
      tags: [playlists]
      summary: Add a film to a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlaylistItemBody"
      responses:
        "201":
          description: Item added
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Not your playlist
        "404":
          description: Playlist not found

  /playlists/{id}/items/{tmdbId}:
    delete:
      operationId: removePlaylistItem
      tags: [playlists]
      summary: Remove a film from a playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized
        "403":
          description: Not your playlist

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    WatchProvider:
      type: object
      properties:
        provider_id:
          type: integer
        provider_name:
          type: string
        logo_url:
          type: string
        type:
          type: string
          enum: [flatrate, rent, buy]
          description: >
            Whether the title is included in a subscription (flatrate),
            or available to rent or buy individually.
        link:
          type: string
          description: JustWatch deep-link for this film (opens the film's page on JustWatch)
      required:
        - provider_id
        - provider_name
        - logo_url

    Movie:
      type: object
      properties:
        id:
          type: integer
        tmdbId:
          type: integer
        title:
          type: string
        releaseYear:
          type: string
        posterUrl:
