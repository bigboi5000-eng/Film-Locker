    ProcessSocialLinkBody:
      type: object
      properties:
        url:
          type: string
          format: uri
        dryRun:
          type: boolean
          description: >
            When true, identify films from the URL but do NOT save them to the
            locker. The response `matches` will include TMDB card data
            (poster_url, title, overview) so the UI can show a confirmation
            card before the user explicitly adds the film.
      required:
        - url

    ProcessSocialLinkResponse:
      type: object
      properties:
        source:
          type: string
          enum: [caption, audio, video, none]
        text:
          type: string
          nullable: true
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMovieMatch"
        saved:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
        listTitle:
          type: string
          nullable: true
          description: >
            Suggested playlist name when the source was a curated/ranked list
            of films (e.g. "Top 10 Horror Films of All Time"), null otherwise.
      required:
        - source
        - matches
        - saved
        - listTitle

    RecommendBody:
      type: object
      properties:
        query:
          type: string
          description: >
            Natural-language film/TV request, e.g. "recommend a 90 minute
            horror film similar to Texas Chainsaw Massacre".
        dryRun:
          type: boolean
          description: >
            When true, identify recommended films but do NOT save them to the
            locker. The response `matches` will include TMDB card data
            (poster_url, title, overview) so the UI can show a confirmation
            card before the user explicitly adds the film.
      required:
        - query

    RecommendResponse:
      type: object
      properties:
        offTopic:
          type: boolean
          description: >
            True when the query wasn't a film/TV request and Gemini refused
            to answer it — matches will be empty in this case.
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMovieMatch"
        saved:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
        listTitle:
          type: string
          nullable: true
          description: >
            Suggested playlist name when the recommendation is a themed set of
            multiple films (e.g. "90s Feel-Good Comedies"), null for a single
            recommendation.
      required:
        - offTopic
        - matches
        - saved
        - listTitle

