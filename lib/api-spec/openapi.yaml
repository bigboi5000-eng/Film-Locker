    ConversationMessageContent:
      type: string
      enum:
        - "❤️"
        - "😂"
        - "😍"
        - "😭"
        - "🤪"
        - "🤓"
        - "🤯"
        - "👍"
        - "🤌"
        - "👎"
        - "Watched it!"
        - "Fool of a Took!"
        - "Prestige Worldwide"
        - "I miss your whispering eye"
        - "Aim for the bushes"
        - "Read a f***ing book"
        - "I'll be back"
        - "Why so serious?"
        - "You can't handle the truth!"
        - "May the Force be with you"
        - "Here's looking at you, kid"
        - "You shall not pass!"
        - "I am Groot"
        - "Say hello to my little friend!"
        - "Life is like a box of chocolates"
        - "To infinity and beyond!"
        - "Nobody puts Baby in a corner"
        - "Great Scott!"
        - "What did you think?"
        - "Have you watched it yet?"
        - "This was great!"
        - "Thank you!"
        - "Not for me this one"
      description: >
        A fixed set of emoji + movie-catchphrases + canned questions —
        deliberately not a freeform string. There is no freeform messaging in
        this app; this enum is enforced server-side (not just left to the
        client UI) so free text can never reach another user through it.

    SendConversationMessageBody:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/ConversationMessageContent"
        replyToNotificationId:
          type: integer
          nullable: true
          description: >
            Targets a specific film recommendation (per-film React button or
            swipe-to-reply). Omit or set null for a standalone message.
      required:
        - content

