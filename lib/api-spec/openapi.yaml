    GeminiMovieMatch:
      type: object
      description: Single movie reference extracted by Gemini, with confidence score
      properties:
        movie_title:
          type: string
        release_year:
          type: string
        confidence_score:
          type: number
          format: float
        tmdb_id:
          type: integer
          nullable: true
        # TMDB card fields — populated in dry-run mode so the UI can show a
        # film card without a separate API call.
        poster_url:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        overview:
          type: string
          nullable: true
        synopsis:
          type: string
          nullable: true
          description: >
            Very short (one-sentence) hook written by Gemini specifically for
            recommend results — only populated by POST /movies/recommend,
            null everywhere else.
      required:
        - movie_title
        - release_year
        - confidence_score

