# Builds the Android app, so testers on Android can be given a build
# without anyone needing Android Studio or a Play Console upload.
#
# Everything happens on EAS's servers; this runner only resolves the config
# plugins in app.json and hands the project over.
#
# Deliberately separate from ios-build.yml rather than a platform input on
# it. That workflow is most of the way Apple credential handling — writing
# out a .p8, patching eas.json for submit, cleaning both up — and none of it
# applies here. Android signing is a keystore EAS holds for the project, and
# there is nothing to submit: the preview profile builds for internal
# distribution, so EAS returns an install link that can be sent straight to
# a tester.
#
# Run it from the Actions tab: "Build Android" → Run workflow.
name: Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview gives an installable APK; production gives an .aab for the Play Store"
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the upload happens here — see --no-wait below — so this needs
    # minutes, not hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The repo is a pnpm workspace and its root package.json refuses npm
      # and yarn outright, so the package manager is not optional here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # eas build reads app.json's config plugins from disk before uploading
      # anything, so a checkout with no node_modules fails on expo-router.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait because the build runs on EAS either way and this runner
      # has nothing to do while it does.
      #
      # The first run of this workflow proved the point: it uploaded in three
      # seconds, printed "Waiting for build to complete", sat in the Android
      # queue for ninety minutes and was killed by the job timeout — while
      # the build itself carried on on EAS, unaffected. All that produced was
      # a cancelled run reporting a failure that had not happened.
      #
      # So the queue is not waited on. The build link is in the step summary
      # below, and EAS emails when the build finishes.
      - name: Queue the build
        working-directory: artifacts/film-locker
        run: |
          # pipefail, because without it this step's status is TEE's, and
          # tee always succeeds. A run with no explicit `shell:` gets
          # `bash -e` and not `-eo pipefail`, so an eas build that failed
          # outright has been marking this step green.
          set -o pipefail

          # 2>&1, because eas writes its progress — the build page link
          # among it — to stderr. Piping stdout alone left build.log without
          # the one line the next step exists to read, which is why the
          # summary has been falling back to "see the log" every time.
          eas build --profile ${{ inputs.profile }} --platform android \
            --non-interactive --no-wait 2>&1 | tee build.log

      - name: Where to find it
        if: success()
        working-directory: artifacts/film-locker
        run: |
          # The build page URL, as eas printed it. One grep, used twice.
          # Colour codes are stripped first: eas emits them even when it is
          # not writing to a terminal, and an escape sequence landing in the
          # middle of the URL would be carried into the link.
          URL="$(sed -e 's/\x1b\[[0-9;]*m//g' build.log \
                 | grep -Eo 'https://expo\.dev/[^ ]*builds/[0-9a-f-]+' \
                 | head -1 || true)"

          # An annotation as well as the summary, because the two are not
          # readable by the same things. The step summary is only on the run's
          # web page — it is not served by the REST API and the job log lives
          # on blob storage — so anything working through the API, this repo's
          # agent included, can see that a build was QUEUED and nothing about
          # which build or how it went. An annotation is on the check run, and
          # the check run is in the API.
          #
          # That gap is not academic: --no-wait means this job goes green the
          # moment EAS accepts the upload, so a build that then fails to
          # compile looks identical from here to one that shipped.
          if [ -n "$URL" ]; then
            echo "::notice title=Android build queued::${URL} (profile: ${{ inputs.profile }}, commit: ${GITHUB_SHA})"
          else
            echo "::notice title=Android build queued::eas printed no build URL — see this step's log."
          fi

          {
            echo "### Android build queued"
            echo ""
            echo "It builds on EAS, not here — this run is finished. The build"
            echo "page below shows progress and carries the download when it is"
            echo "done; EAS also emails on completion."
            echo ""
            if [ -n "$URL" ]; then
              echo "- Build page: ${URL}"
            else
              echo "- See the Queue the build step's log for the build URL."
            fi
            echo ""
            if [ "${{ inputs.profile }}" = "preview" ]; then
              echo "This is the preview profile, so the artifact is an APK for"
              echo "internal distribution: the build page's install link can go"
              echo "straight to a tester."
            else
              echo "This is the production profile, so the artifact is an .aab"
              echo "for the Play Store rather than a sideloadable APK."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The counterpart to the notice above, for when there is no build to
      # point at. A failed step leaves its reason only in the job log, and
      # the job log is on blob storage that the REST API does not serve — so
      # "the build did not happen" has been arriving with no sign of why.
      # eas says perfectly clearly what went wrong; it just said it somewhere
      # nothing could read. This puts the tail of it on the check run.
      - name: Why it failed
        if: failure()
        working-directory: artifacts/film-locker
        run: |
          if [ -s build.log ]; then
            # Workflow commands are one line, so newlines become %0A and a
            # literal % has to be escaped first or it eats what follows.
            MSG="$(sed -e 's/\x1b\[[0-9;]*m//g' build.log \
                   | tail -n 30 \
                   | sed -e 's/%/%25/g' -e 's/\r//g' \
                   | awk '{ printf "%s%%0A", $0 }')"
            echo "::error title=eas build failed::${MSG}"
          else
            echo "::error title=eas build failed::eas wrote no output at all — it failed before it started."
          fi

      # Written by the step above, and it holds nothing sensitive, but it sits
      # in the working tree and this keeps the checkout clean.
      - name: Tidy up
        if: always()
        working-directory: artifacts/film-locker
        run: rm -f build.log
