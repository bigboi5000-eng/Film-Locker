# Builds the Android app, so testers on Android can be given a build
# without anyone needing Android Studio or a Play Console upload.
#
# Everything happens on EAS's servers; this runner only resolves the config
# plugins in app.json and hands the project over.
#
# Deliberately separate from ios-build.yml rather than a platform input on
# it. That workflow is most of the way Apple credential handling — writing
# out a .p8, patching eas.json for submit, cleaning both up — and none of it
# applies here. Android signing is a keystore EAS holds for the project, and
# there is nothing to submit: the preview profile builds for internal
# distribution, so EAS returns an install link that can be sent straight to
# a tester.
#
# Run it from the Actions tab: "Build Android" → Run workflow.
name: Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview gives an installable APK; production gives an .aab for the Play Store"
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the upload happens here — see --no-wait below — so this needs
    # minutes, not hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The repo is a pnpm workspace and its root package.json refuses npm
      # and yarn outright, so the package manager is not optional here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # eas build reads app.json's config plugins from disk before uploading
      # anything, so a checkout with no node_modules fails on expo-router.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait because the build runs on EAS either way and this runner
      # has nothing to do while it does.
      #
      # The first run of this workflow proved the point: it uploaded in three
      # seconds, printed "Waiting for build to complete", sat in the Android
      # queue for ninety minutes and was killed by the job timeout — while
      # the build itself carried on on EAS, unaffected. All that produced was
      # a cancelled run reporting a failure that had not happened.
      #
      # So the queue is not waited on. The build link is in the step summary
      # below, and EAS emails when the build finishes.
      - name: Queue the build
        working-directory: artifacts/film-locker
        run: |
          eas build --profile ${{ inputs.profile }} --platform android \
            --non-interactive --no-wait | tee build.log

      - name: Where to find it
        if: success()
        working-directory: artifacts/film-locker
        run: |
          {
            echo "### Android build queued"
            echo ""
            echo "It builds on EAS, not here — this run is finished. The build"
            echo "page below shows progress and carries the download when it is"
            echo "done; EAS also emails on completion."
            echo ""
            # The build page URL, as eas printed it.
            grep -Eo 'https://expo\.dev/[^ ]*builds/[0-9a-f-]+' build.log \
              | head -1 \
              | sed 's/^/- Build page: /' \
              || echo "- See the Queue the build step's log for the build URL."
            echo ""
            if [ "${{ inputs.profile }}" = "preview" ]; then
              echo "This is the preview profile, so the artifact is an APK for"
              echo "internal distribution: the build page's install link can go"
              echo "straight to a tester."
            else
              echo "This is the production profile, so the artifact is an .aab"
              echo "for the Play Store rather than a sideloadable APK."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Written by the step above, and it holds nothing sensitive, but it sits
      # in the working tree and this keeps the checkout clean.
      - name: Tidy up
        if: always()
        working-directory: artifacts/film-locker
        run: rm -f build.log
