# Builds and optionally submits the iOS app, so neither is tied to having a
# particular laptop to hand.
#
# Everything happens on EAS's servers either way — this runner only resolves
# the config plugins in app.json and hands the project over, which is why a
# Linux runner is fine for an iOS build and why no Mac is involved anywhere.
#
# Apple authentication uses an App Store Connect API key rather than an Apple
# ID. The Apple ID login fails from every environment we have tried it in
# with "iTunes service key is empty", before it even asks for a two-factor
# code; the API key talks to a different endpoint and works.
#
# Run it from the Actions tab: "Build iOS" → Run workflow.
name: Build iOS

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit to App Store Connect when the build finishes"
        type: boolean
        default: true
      profile:
        description: "EAS build profile"
        type: choice
        options: [production, preview]
        default: production

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous because the submit step is unpredictable: it waits on Apple's
    # ingest, which took 78 minutes on the run of 2026-10-07 — the build
    # itself was 7. At the previous ceiling of 90 that run finished with four
    # minutes to spare, and a job killed mid-submit is the expensive kind of
    # failure, because the upload has to start over.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      # The repo is a pnpm workspace and its root package.json refuses npm
      # and yarn outright, so the package manager is not optional here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # eas build reads app.json's config plugins from disk before uploading
      # anything, so a checkout with no node_modules fails on expo-router.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The .p8 cannot be committed, so it is held as a base64 secret and
      # written out here. It lives under the runner's home directory rather
      # than the workspace so it cannot be picked up by anything that walks
      # the repo.
      # Accepts the secret either as base64 or as the .p8 file's own text.
      #
      # The first attempt at this assumed base64 and failed with "base64:
      # invalid input" — which does not say that the contents were pasted
      # raw, and cannot say more, because GitHub masks the secret in the log
      # so there is nothing to inspect. Taking both forms removes the choice
      # rather than documenting it.
      - name: Write the App Store Connect API key
        run: |
          mkdir -p "$HOME/asc"
          printf '%s' "${{ secrets.ASC_API_KEY_BASE64 }}" > "$HOME/asc/secret.raw"

          if grep -q "BEGIN PRIVATE KEY" "$HOME/asc/secret.raw"; then
            echo "Secret holds the key directly."
            cp "$HOME/asc/secret.raw" "$HOME/asc/AuthKey.p8"
          else
            echo "Secret looks base64 encoded; decoding."
            # Whitespace stripped first: a secret pasted from a wrapped
            # terminal arrives with newlines in it.
            tr -d '[:space:]' < "$HOME/asc/secret.raw" | base64 -d > "$HOME/asc/AuthKey.p8" || {
              echo "::error::ASC_API_KEY_BASE64 is neither a .p8 file nor valid base64."
              echo "::error::Set it to the whole AuthKey_XXXX.p8 file, headers included,"
              echo "::error::or to the output of: base64 -i AuthKey_XXXX.p8 | tr -d '\n'"
              exit 1
            }
          fi

          rm -f "$HOME/asc/secret.raw"
          chmod 600 "$HOME/asc/AuthKey.p8"

          # Fail here rather than letting eas report something vaguer later.
          if ! grep -q "BEGIN PRIVATE KEY" "$HOME/asc/AuthKey.p8"; then
            echo "::error::The decoded key is not a PEM private key. Check the secret"
            echo "::error::contains the whole .p8 file, BEGIN and END lines included."
            exit 1
          fi
          echo "Key written, $(wc -c < "$HOME/asc/AuthKey.p8") bytes."

          # Exported through GITHUB_ENV rather than referenced as
          # ${{ env.HOME }} in a later step's env block: HOME is not resolved
          # in that context and the path would come through empty.
          echo "ASC_KEY_PATH=$HOME/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build
        working-directory: artifacts/film-locker
        env:
          EXPO_ASC_API_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          # Without this the build dies at "Failed to sync capabilities". EAS
          # reconciles the App ID against app.json, finds nothing declaring
          # Sign in with Apple — the app uses Clerk's browser flow, not
          # expo-apple-authentication — and tries to switch the capability
          # off, which guideline 4.8 requires to stay on.
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: eas build --profile ${{ inputs.profile }} --platform ios --non-interactive

      # eas submit does not read the EXPO_ASC_* variables the build step
      # uses. It looks for the key in eas.json's submit profile, and refuses
      # to ask for it with --non-interactive: "App Store Connect API Keys
      # cannot be set up in --non-interactive mode."
      #
      # So the fields are written in here, on the runner, from the same
      # secrets. They never reach the repository, which is the only reason
      # they can be committed nowhere: eas.json is tracked, and a key id and
      # issuer id do not belong in it.
      - name: Point eas.json at the API key
        if: ${{ inputs.submit }}
        working-directory: artifacts/film-locker
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          jq --arg path "$ASC_KEY_PATH" \
             --arg keyId "$ASC_KEY_ID" \
             --arg issuerId "$ASC_ISSUER_ID" \
             '.submit.production.ios.ascApiKeyPath = $path
              | .submit.production.ios.ascApiKeyId = $keyId
              | .submit.production.ios.ascApiKeyIssuerId = $issuerId' \
             eas.json > eas.json.tmp && mv eas.json.tmp eas.json
          # Confirm the shape without printing the values.
          jq -e '.submit.production.ios | has("ascApiKeyPath") and has("ascApiKeyId") and has("ascApiKeyIssuerId")' eas.json > /dev/null
          echo "eas.json now carries the API key fields."

      - name: Submit to App Store Connect
        if: ${{ inputs.submit }}
        working-directory: artifacts/film-locker
        env:
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: eas submit --platform ios --latest --non-interactive

      # The runner is destroyed either way, but eas.json is a tracked file
      # and leaving a modified copy around invites a later step committing it.
      - name: Restore eas.json
        if: always()
        working-directory: artifacts/film-locker
        run: git checkout -- eas.json || true

      # The key is on an ephemeral runner that is destroyed either way, but
      # deleting it explicitly means a later step added to this file cannot
      # read it by accident.
      - name: Remove the API key
        if: always()
        run: rm -f "$HOME/asc/AuthKey.p8"
