# Redeploys the API server on Railway, so a deploy is something that can be
# kicked from here rather than only from the dashboard on a phone.
#
# Railway already deploys this service on every push to main through its
# GitHub integration, and that is still the normal path — this workflow is
# for the times it does not take: auto-deploy switched off, a deployment
# that failed and needs re-running, or a redeploy wanted without a commit
# to hang it on.
#
# It REDEPLOYS rather than uploads. `railway up` would tar the checkout and
# push that instead, which works but changes how the code reaches Railway
# and bypasses the GitHub source the service is configured against. Since
# auto-deploy already creates a deployment for the newest commit, re-running
# the latest one is both the smaller hammer and the one that cannot deploy
# something different from what GitHub sent.
#
# That has a consequence worth knowing: this redeploys THE LATEST
# DEPLOYMENT, which is the latest commit only if auto-deploy created one. If
# auto-deploy is off, fix that in the service's settings rather than
# expecting this to pick up new commits.
#
# Setup, once, and there are two ways because Railway has two kinds of token
# that go in two differently named variables. Mixing them up is the usual
# cause of "Invalid token", and setting both at once is itself an error.
#
#   EITHER a PROJECT token, as the RAILWAY_TOKEN secret.
#     Railway → the project → Settings → Tokens. Simplest: the token is
#     already scoped to one project and environment, so nothing else needs
#     naming. If that page is not where you are looking, try the URL
#     directly — railway.com/project/<project-id>/settings/tokens — since
#     the tab is easy to miss and is not always shown on a phone.
#
#   OR an ACCOUNT token, as the RAILWAY_API_TOKEN secret.
#     Railway → Account Settings → Tokens, leaving the workspace dropdown
#     on "No workspace": picking one makes it workspace-scoped, which the
#     CLI has been known to reject. An account token is not tied to a
#     project, so this path also needs the `project` input below, which is
#     the id in the dashboard URL.
#
# Run it from the Actions tab: "Deploy API (Railway)" → Run workflow.
name: Deploy API (Railway)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Railway service to redeploy"
        type: string
        default: "@workspace/api-server"
      project:
        description: "Project id — only needed when using an account token"
        type: string
        default: ""
      environment:
        description: "Environment to deploy — only used with an account token"
        type: string
        default: "production"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The CLI returns as soon as the redeploy is accepted; the build itself
    # runs on Railway. Minutes, not hours.
    timeout-minutes: 15

    # Lifted to the job because a step's `if` cannot read `secrets` — that
    # context is not available there, and a workflow that tries is not an
    # erroring workflow but an UNPARSEABLE one. GitHub then fails a run on
    # every push, named after this file and with no jobs in it, which is a
    # much more confusing thing to be sent an email about than a missing
    # token. `env` is available in a step's `if`, so the presence of a token
    # is tested through these rather than through `secrets` directly.
    env:
      PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      ACCOUNT_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      # Said plainly and early. Without the secret the CLI fails several
      # steps later with an authentication error that reads like something
      # is wrong with Railway rather than with this repository's settings.
      - name: Check a token is present
        run: |
          if [ -z "$PROJECT_TOKEN" ] && [ -z "$ACCOUNT_TOKEN" ]; then
            echo "::error::Neither RAILWAY_TOKEN nor RAILWAY_API_TOKEN is set." \
                 "Add one as a repository secret — see the comment at the top of this file."
            exit 1
          fi
          if [ -n "$PROJECT_TOKEN" ] && [ -n "$ACCOUNT_TOKEN" ]; then
            echo "::error::Both RAILWAY_TOKEN and RAILWAY_API_TOKEN are set." \
                 "The CLI rejects that outright. Remove whichever one you are not using."
            exit 1
          fi
          if [ -z "$PROJECT_TOKEN" ] && [ -z "${{ inputs.project }}" ]; then
            echo "::error::An account token needs the project id too, since it is not" \
                 "scoped to one. Re-run with the 'project' input set — it is the id in" \
                 "the Railway dashboard URL."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pinned. An unpinned CLI is a third party able to change what this
      # workflow does to a live service between one run and the next.
      - name: Install the Railway CLI
        run: npm install -g @railway/cli@4.5.3

      # A project token already knows which project and environment it
      # belongs to. An account token does not, so it has to be pointed at
      # one before anything can be redeployed.
      - name: Link the project
        if: ${{ env.PROJECT_TOKEN == '' }}
        env:
          RAILWAY_API_TOKEN: ${{ env.ACCOUNT_TOKEN }}
        run: |
          railway link \
            --project "${{ inputs.project }}" \
            --environment "${{ inputs.environment }}" \
            --service "${{ inputs.service }}"

      - name: Redeploy
        env:
          RAILWAY_TOKEN: ${{ env.PROJECT_TOKEN }}
          RAILWAY_API_TOKEN: ${{ env.ACCOUNT_TOKEN }}
        run: railway redeploy --service "${{ inputs.service }}" --yes

      # Best effort: the redeploy has already been accepted by this point,
      # so a failure to read the status back is not a failed deploy and must
      # not be reported as one.
      - name: Report what is now deploying
        if: always()
        env:
          RAILWAY_TOKEN: ${{ env.PROJECT_TOKEN }}
          RAILWAY_API_TOKEN: ${{ env.ACCOUNT_TOKEN }}
        continue-on-error: true
        run: |
          {
            echo "### Railway redeploy requested"
            echo ""
            echo "Service: \`${{ inputs.service }}\`"
            echo ""
            echo "It builds on Railway, not here. Migrations run on container"
            echo "start, so a deploy is also how pending migrations apply."
            echo ""
            railway status 2>/dev/null || echo "_Status unavailable — check the Railway dashboard._"
          } >> "$GITHUB_STEP_SUMMARY"
